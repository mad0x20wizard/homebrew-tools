name: Publish packages

on:
  pull_request_target:
    types:
      - labeled

env:
  BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  pr-pull:
    if: contains(github.event.pull_request.labels.*.name, 'pr-pull')

    runs-on: ubuntu-24.04

    permissions:
      actions: read
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Homebrew's Linux sandbox requires bwrap on PATH before brew pr-pull runs brew doctor.
      # The sysctls enable the rootless user namespaces that bwrap needs to create the sandbox.
      - name: Set up Homebrew Linux sandbox
        if: runner.os == 'Linux'
        run: |
          brew install bubblewrap
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w user.max_user_namespaces=28633
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Set up git
        uses: Homebrew/actions/git-user-config@main

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}

        run: |
          brew pr-pull \
            --debug \
            --tap="$GITHUB_REPOSITORY" \
            --workflows="build.yml" \
            "$PULL_REQUEST"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@main
        with:
          branch: main

      - name: Delete branch
        run: git push --delete origin "$BRANCH"